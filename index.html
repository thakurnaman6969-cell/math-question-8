
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Question 9</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
  font-family: Georgia, serif;
}
.question {
  background: white;
  padding: 35px 20px;
  border-radius: 12px;
  text-align: center;
  font-size: clamp(22px, 5vw, 34px);
  box-shadow: 0 3px 15px #0002;
}
.fraction {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
}
.top {
  border-bottom: 1px solid black;
  padding: 0 8px 5px;
}
.bottom {
  padding-top: 5px;
}
.integral {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  align-items: center;
  margin: 0 5px;
  line-height: 1;
}
.integral .upper, .integral .lower {
  font-size: 13px;
}
.integral .symbol {
  font-size: 42px;
}
</style>
</head>
<body>
<div class="question">
  1666667
  <span class="integral">
    <span class="upper">1</span>
    <span class="symbol">∫</span>
    <span class="lower">1/3</span>
  </span>
  <span class="fraction">
    <span class="top">∛(x − x³)</span>
    <span class="bottom">x⁴</span>
  </span>
  dx
</div>
</body>
</html>
